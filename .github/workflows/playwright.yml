name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
# A new push to the same PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Browsers and their system dependencies are preinstalled in this image.
    # Keep the tag in sync with @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: npm ci
    - name: Run Playwright tests
      run: npx playwright test
      env:
        SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
        SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
